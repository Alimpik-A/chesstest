    }
    case 'wifi': {
      const cells = emptyCells().filter(x=>!G.wifiCells.has(key(x.r,x.c)) && !G.suits.has(key(x.r,x.c)));
      if(cells.length){
        const t = pick(cells);
        G.wifiCells.add(key(t.r,t.c));
        log(`→ Клетка Wi-Fi на ${sqName(t.r,t.c)}. Фигура ходит в радиусе 3, но не рубит.`);
      } else log('→ Нет места для вайфая.');
      break;
    }
    case 'meteorites': {
      const cells = emptyCells();
      let n = 0;
      const shuffled = shuffle(cells);
      for(let i=0;i<3 && i<shuffled.length;i++){
        const t = shuffled[i];
        G.meteorCells.add(key(t.r,t.c));
        n++;
      }
      let dinos = 0;
      for(const d of allPieces(null)){
        if(d.p.type === 'dino'){ setPieceAt(d.r,d.c,d.b2,null); dinos++; }
      }
      log(`→ Метеориты: ${n} клеток. Погибло динозавров: ${dinos}.`);
      break;
    }
    case 'northCentral': {
      const mr = Math.floor((G.minR + G.maxR) / 2);
      const mc = Math.floor((G.minC + G.maxC) / 2);
      const cells = [
        {r:mr,c:mc},{r:mr,c:mc+1},{r:mr+1,c:mc},{r:mr+1,c:mc+1}
      ];
      const suits = ['hearts','diamonds','clubs','spades'];
      let n = 0;
      for(let i=0;i<cells.length;i++){
        const t = cells[i];
        if(!inB(t.r,t.c)) continue;
        if(G.suits.has(key(t.r,t.c))) continue;
        G.suits.set(key(t.r,t.c), suits[i % suits.length]);
        n++;
      }
      log(`→ Северный централ: ${n} центральных клеток получили бонусы мастей.`);
      break;
    }
    case 'angel': {
      const rooks = allPieces(null).filter(x=>x.p.type === 'r' && !x.p.isAngel);
      if(rooks.length){
        const t = pick(rooks);
        t.p.isAngel = true;
        log(`→ Ладья на ${sqName(t.r,t.c)} стала Ангелом.`);
      } else log('→ Нет ладьи для ангела.');
      break;
    }
    case 'cheats': {
      for(const col of ['w','b']){
        while(G.hands[col].length < 4){
          G.hands[col].push(randomCardId());
        }
      }
      log('→ Читы! У всех по четыре карты.');
      break;
    }
    case 'illuminati': {
      const bishops = allPieces(null).filter(x=>x.p.type === 'b' && !x.p.isEye && !x.p.isMonarch);
      if(bishops.length){
        const t = pick(bishops);
        t.p.isEye = true;
        log(`→ Слон на ${sqName(t.r,t.c)} стал глазом Иллюмината.`);
      } else log('→ Нет слона для иллюмината.');
      break;
    }
    case 'anchor': {
      const pieces = allPieces(opp).filter(x=>x.p.type !== 'k' && x.p.anchorTurns <= 0 && x.p.statue <= 0);
      if(pieces.length){
        const t = pick(pieces);
        t.p.anchorTurns = 6;
        log(`→ Фигура противника на ${sqName(t.r,t.c)} заякорена на 3 хода.`);
      } else log('→ Нет цели для якоря.');
      break;
    }
    case 'superiority': {
      const cells = emptyCells().filter(x=>!G.goldCells.has(key(x.r,x.c)));
      const shuffled = shuffle(cells);
      let n = 0;
      for(let i=0;i<5 && i<shuffled.length;i++){
        const t = shuffled[i];
        G.goldCells.add(key(t.r,t.c));
        n++;
      }
      log(`→ Превосходство: ${n} жёлтых клеток.`);
      break;
    }
    case 'algebra': {
      const cells = emptyCells().filter(x=>!G.algebraMap.has(key(x.r,x.c)));
      const shuffled = shuffle(cells);
      G.algebraMap.clear();
      G.algebraCollected = {w:0, b:0};
      for(let i=0;i<3 && i<shuffled.length;i++){
        const t = shuffled[i];
        G.algebraMap.set(key(t.r,t.c), i + 1);
      }
      log('→ Алгебра: три клетки с цифрами 1, 2, 3. Король должен собрать их по порядку.');
      break;
    }
  }

  ensureKings();
}

function randomCardId(){ return pick(CARDS).id; }

/* ============================ ХОД ИГРЫ ============================ */
function startTurn(color){
  G.canUseCard[color] = !G.pendingBlock[color] && G.eff.cardLock[color] <= 0 && G.eff.noCards <= 0;
  G.pendingBlock[color] = false;
  G.cardUsedThisTurn[color] = false;
}

function beginTurn(){
  if(G.blitzTimer){ clearTimeout(G.blitzTimer); G.blitzTimer = null; }
  startTurn(G.turn);
  if(G.eff.blitz > 0){
    const c = G.turn;
    G.blitzTimer = setTimeout(() => {
      if(G.turn === c && !G.over){
        log('⏰ Время вышло! Ход пропущен.');
        endTurn();
      }
    }, 5000);
  }
}

function tickEffects(){
  const e = G.eff;
  if(e.bishopsRooks>0) e.bishopsRooks--;
  if(e.knightsBackward>0) e.knightsBackward--;
  if(e.pawnsAnyDir>0) e.pawnsAnyDir--;
  if(e.pawnsInvisible>0) e.pawnsInvisible--;
  if(e.knightsRooks>0) e.knightsRooks--;
  if(e.pawnsTwoStep>0) e.pawnsTwoStep--;
  if(e.noCards>0) e.noCards--;
  if(e.blitz>0) e.blitz--;
  if(e.dnd>0) e.dnd--;
  if(e.unboundedDelay>0) e.unboundedDelay--;
  if(e.bioWeapon>0){
    e.bioWeapon--;
    const targets = allPieces(null, true).filter(x=>x.p.type==='b' || x.p.type==='n');
    if(targets.length){
      const t = pick(targets);
      setPieceAt(t.r, t.c, t.b2, null);
      log(`☣ Биооружие уничтожило фигуру на ${sqName(t.r,t.c,t.b2)}.`);
    } else { e.bioWeapon = 0; }
  }

  for(const col of ['w','b']){
    if(e.kingImmune[col]>0) e.kingImmune[col]--;
    if(e.noCapture[col]>0) e.noCapture[col]--;
    if(e.kingTwoStep[col]>0) e.kingTwoStep[col]--;
    if(e.cardLock[col]>0) e.cardLock[col]--;
    if(e.queenAsPawn[col]>0) e.queenAsPawn[col]--;
    if(e.pawnsBackward[col]>0) e.pawnsBackward[col]--;
    if(e.kingAsRook[col]>0) e.kingAsRook[col]--;
  }

  const toRemove = [];
  const processPiece = (r,c,p,b2) => {
    if(!p) return;
    if(p.statue>0) p.statue--;
    if(p.tempQueen>0) p.tempQueen--;
    if(p.frozen>0) p.frozen--;
    if(p.anchorTurns>0) p.anchorTurns--;
    if(p.suitKnightTurns>0) p.suitKnightTurns--;
    if(p.suitRookTurns>0) p.suitRookTurns--;
    if(p.tempBishopTurns>0){
      p.tempBishopTurns--;
      if(p.tempBishopTurns === 0 && p.originalType){
        p.type = p.originalType;
        p.originalType = null;
        log(`♦ Бонус бубны закончился: фигура на ${sqName(r,c,b2)} вернула тип.`);
      }
    }
    if(p.ghostTurns>0){
      p.ghostTurns--;
      if(p.ghostTurns === 0){
        toRemove.push({r,c,b2});
        log(`👻 Призрак исчез на ${sqName(r,c,b2)}.`);
      }
    }
  };
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++) processPiece(r,c,G.board[r][c],false);
  if(G.b2Active) for(let r=G.b2.minR;r<=G.b2.maxR;r++) for(let c=G.b2.minC;c<=G.b2.maxC;c++) processPiece(r,c,G.board2[r][c],true);
  for(const rm of toRemove) setPieceAt(rm.r, rm.c, rm.b2, null);

  /* Динамит */
  for(const [k, turns] of [...G.dynamiteMap]){
    if(turns <= 1){
      G.dynamiteMap.delete(k);
      const [rr,cc] = k.split(',').map(Number);
      // взрыв в радиусе 1
      for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
        const tr=rr+dr, tc=cc+dc;
        if(!inB(tr,tc)) continue;
        const p = G.board[tr][tc];
        if(p && p.type !== 'k'){
          G.board[tr][tc] = null;
          log(`🧨 Динамит уничтожил фигуру на ${sqName(tr,tc)}.`);
        } else if(p && p.type === 'k'){
          log(`🧨 Динамит: король на ${sqName(tr,tc)} невредим.`);
        }
      }
      // очистим динамитную клетку от других маркеров не нужно, клетка просто возвращается в норму
    } else {
      G.dynamiteMap.set(k, turns - 1);
    }
  }

  /* Метеориты — просто визуальные клетки, эффект уже применён */
  /* нет таймера */

  /* Солнце / Луна */
  for(const [k, turns] of [...G.sunCells]){
    if(turns <= 1){ G.sunCells.delete(k); log(`☀ Солнце погасло.`); }
    else G.sunCells.set(k, turns-1);
  }
  for(const [k, turns] of [...G.moonCells]){
    if(turns <= 1){ G.moonCells.delete(k); log(`🌙 Луна погасла.`); }
    else G.moonCells.set(k, turns-1);
  }

  const redUpdates = [];
  for(const [k, turns] of G.redCells){
    redUpdates.push({k, turns: turns-1});
  }
  for(const {k, turns} of redUpdates){
    if(turns <= 0){ G.blocked.add(k); G.redCells.delete(k); }
    else { G.redCells.set(k, turns); }
  }

  if(G.fire.size > 0){
    G.fireTimer--;
    if(G.fireTimer <= 0){
      G.fireTimer = 7;
      const newFire = new Set(G.fire);
      for(const k of G.fire){
        const parts = k.split(',');
        const r = parseInt(parts[0],10), c = parseInt(parts[1],10);
        for(const [dr,dc] of ROOK_D){
          const tr=r+dr, tc=c+dc;
          if(inB(tr,tc)) newFire.add(key(tr,tc));
        }
      }
      let destroyed = 0;
      for(const k of newFire){
        if(!G.fire.has(k)){
          const parts = k.split(',');
          const r = parseInt(parts[0],10), c = parseInt(parts[1],10);
          const p = G.board[r][c];
          if(p){ G.board[r][c] = null; destroyed++; log(`🔥 Огонь уничтожил фигуру.`); }
        }
      }
      G.fire = newFire;
      if(destroyed === 0) log('🔥 Огонь распространился.');
    }
  }

  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    const p = G.board[r][c];
    if(p && p.type === 'monolith'){
      for(const [dr,dc] of KING_D){
        const tr=r+dr, tc=c+dc;
        if(!inB(tr,tc)) continue;
        const q = G.board[tr][tc];
        if(q && q.type === 'n'){ q.type = 'dino'; log(`🗿 Монолит превратил коня в динозавра.`); }
      }
    }
  }

  const demons = [];
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    const p = G.board[r][c];
    if(p && p.type === 'demon') demons.push({r,c});
  }
  for(const d of demons){
    const dirs = shuffle(KING_D);
    for(const [dr,dc] of dirs){
      const tr = d.r + dr, tc = d.c + dc;
      if(!inB(tr,tc) || G.board[tr][tc] || isBlockedCell(tr,tc)) continue;
      G.board[tr][tc] = G.board[d.r][d.c];
      G.board[d.r][d.c] = null;
      d.r = tr; d.c = tc;
      break;
    }
    for(const [dr,dc] of KING_D){
      const tr = d.r + dr, tc = d.c + dc;
      if(!inB(tr,tc)) continue;
      const q = G.board[tr][tc];
      if(q && (q.color === 'w' || q.color === 'b') && q.type !== 'k' && q.type !== 'ghost'){
        G.board[tr][tc] = null;
        log(`👹 Демон съел фигуру на ${sqName(tr,tc)}.`);
      }
    }
  }

  for(const bKey of [...G.barracks]){
    const parts = bKey.split(',');
    const br = parseInt(parts[0],10), bc = parseInt(parts[1],10);
    let wC = 0, bC = 0;
    for(const [dr,dc] of KING_D){
      const tr = br + dr, tc = bc + dc;
      if(!inB(tr,tc)) continue;
      const p = G.board[tr][tc];
      if(p && p.color === 'w') wC++;
      else if(p && p.color === 'b') bC++;
    }
    if(wC + bC === 1){
      const col = wC === 1 ? 'w' : 'b';
      for(const [dr,dc] of KING_D){
        const tr = br + dr, tc = bc + dc;
        if(inB(tr,tc) && !G.board[tr][tc] && !isBlockedCell(tr,tc)){
          const np = mk(col, 'p'); np.moved = true;
          G.board[tr][tc] = np;
          log(`🏛 Казарма создала пешку ${col==='w'?'белых':'чёрных'}.`);
          break;
        }
      }
    }
  }

  if(G.eff.stalemateReality && !G.endgameActive){
    const total = allPieces(null).filter(x=>x.p.color === 'w' || x.p.color === 'b').length;
    if(total < 6){
      G.endgameActive = true;
      log('⚠️ ТУПИКОВАЯ РЕАЛЬНОСТЬ! Игроки получают по 2 слона и 2 шашки.');
      for(const col of ['w','b']){
        const k = findKing(col);
        let placed = 0;
        if(k && !k.b2){
          for(const [dr,dc] of KING_D){
            if(placed >= 4) break;
            const tr = k.r + dr, tc = k.c + dc;
            if(inB(tr,tc) && !G.board[tr][tc] && !isBlockedCell(tr,tc)){
              const type = placed < 2 ? 'b' : 'c';
              const np = mk(col, type); np.moved = true;
              G.board[tr][tc] = np; placed++;
            }
          }
        }
      }
      const midR = Math.floor((G.minR + G.maxR) / 2);
      const midC = Math.floor((G.minC + G.maxC) / 2);
      G.endgameCells.clear();
      G.endgameCells.add(key(midR, midC));
      G.endgameCells.add(key(midR, midC + 1));
      G.endgameCells.add(key(midR + 1, midC));
      G.endgameCells.add(key(midR + 1, midC + 1));
    }
  }
}

function evaluate(){
  ensureKings();

  if(G.endgameActive && !G.over){
    for(const col of ['w','b']){
      let cnt = 0;
      for(const k of G.endgameCells){
        const [r,c] = k.split(',').map(Number);
        const p = G.board[r] ? G.board[r][c] : null;
        if(p && p.color === col) cnt++;
      }
      if(G.endgameCells.size > 0 && cnt === G.endgameCells.size){
        G.over = true;
        G.msg = `⚡ Тупиковая Реальность завершена! Побеждают ${col === 'w' ? 'белые' : 'чёрные'}!`;
        return;
      }
    }
  }

  const moves = legalMoves(G.turn);
  if(moves.length===0){
    const k = findKing(G.turn);
    if(!k){ ensureKings(); return; }
    const inCheck = G.eff.kingImmune[G.turn]<=0 && isAttackedBoard(k.r,k.c,oppOf(G.turn), !!k.b2);
    if(!inCheck && G.eff.noDraws){
      const cells = trulyFreeCells();
      if(cells.length){
        setPieceAt(k.r,k.c,k.b2, null);
        const t = pick(cells);
        const np = mk(G.turn, 'k'); np.moved = true;
        G.board[t.r][t.c] = np;
        log(`♻️ Пат! Король телепортирован.`);
        return;
      }
    }
    G.over = true;
    G.msg = inCheck
      ? (G.turn==='w' ? 'Мат! Побеждают чёрные.' : 'Мат! Побеждают белые.')
      : 'Пат. Ничья.';
  }
}

function endTurn(){
  if(G.blitzTimer){ clearTimeout(G.blitzTimer); G.blitzTimer = null; }
  tickEffects();
  ensureKings();

  const c = G.turn;
  if(G.drawCounter[c] > 0){
    G.drawCounter[c]--;
    if(G.drawCounter[c] === 0){
      G.hands[c].push(randomCardId());
      log(`${c==='w'?'Белые':'Чёрные'}: получена новая карточка.`);
    }
  }

  G.turn = oppOf(c);
  if(G.skipNext[G.turn]){
    G.skipNext[G.turn] = false;
    log(`${G.turn==='w'?'Белые':'Чёрные'} пропускают ход.`);
    G.turn = oppOf(G.turn);
  }
  beginTurn();
  G.selected = null;
  G.legal = [];
  evaluate();
  render();
}

function applySuitEffect(p, r, c){
  if(p.type === 'k') return;
  const suit = G.suits.get(key(r,c));
  if(!suit) return;
  if(suit === 'hearts'){
    p.suitKnightTurns = 10;
    log(`♥ Фигура на ${sqName(r,c)} получила ход коня (5 ходов).`);
  } else if(suit === 'diamonds'){
    if(p.type !== 'b'){
      p.originalType = p.type;
      p.type = 'b';
    }
    p.tempBishopTurns = 10;
    log(`♦ Фигура на ${sqName(r,c)} стала слоном (5 ходов).`);
  } else if(suit === 'spades'){
    p.suitRookTurns = 10;
    log(`♠ Фигура на ${sqName(r,c)} получила ход ладьи (5 ходов).`);
  }
}

function doMove(m){
  if(G.blitzTimer){ clearTimeout(G.blitzTimer); G.blitzTimer = null; }
  const p = getPieceAt(m.from.r, m.from.c, !!m.fromBoard2);
  if(!p) return;

  const targetPiece = getPieceAt(m.to.r, m.to.c, !!m.toBoard2);
  if(targetPiece && G.eff.dnd > 0){
    const roll = Math.floor(Math.random() * 20) + 1;
    log(`🎲 D&D: выпало ${roll}.`);
    if(roll < 10){
      log(`🎲 Взятие не удалось!`);
      if(p.type !== 'k'){
        setPieceAt(m.from.r, m.from.c, !!m.fromBoard2, null);
        log(`🎲 Фигура нападавшего исчезла.`);
      }
      G.selected = null; G.legal = [];
      endTurn(); return;
    }
  }

  const u = makeMove(m);
  G.lastMove = {from:m.from, to:m.to, fromB2:!!m.fromBoard2, toB2:!!m.toBoard2};

  if((u.captured) && G.eff.knightify[p.color] && p.type==='p'){
    p.type = 'n';
    log(`🐴 Пешка превратилась в коня при взятии!`);
  }

  if(p.type==='p'){
    if(m.toBoard2){
      if((p.color==='w' && m.to.r===G.b2.minR) || (p.color==='b' && m.to.r===G.b2.maxR)){
        p.type = 'q'; log(`↑ Пешка прошла в ферзи!`);
      }
    } else if(!m.fromBoard2){
      const promoRow = p.color==='w' ? G.minR : G.maxR;
      if(m.to.r===promoRow){ p.type = 'q'; log(`↑ Пешка прошла в ферзи!`); }
    }
  }

  if(!m.toBoard2){
    const destKey = key(m.to.r, m.to.c);

    // Ангел: сбрасывает эффект клетки при входе
    if(p.isAngel){
      let cleared = false;
      if(G.suits.delete(destKey)){ cleared = true; }
      if(G.sunCells.delete(destKey)){ cleared = true; }
      if(G.moonCells.delete(destKey)){ cleared = true; }
      if(G.wifiCells.delete(destKey)){ cleared = true; }
      if(G.fire.delete(destKey)){ cleared = true; }
      if(G.blocked.delete(destKey)){ cleared = true; }
      if(G.circles.delete(destKey)){ cleared = true; }
      if(G.goldCells.delete(destKey)){ cleared = true; }
      if(G.meteorCells.delete(destKey)){ cleared = true; }
      if(G.clubsZones.delete(destKey)){ cleared = true; }
      if(cleared) log(`😇 Ангел сбросил эффект клетки ${sqName(m.to.r,m.to.c)}.`);
    }

    if(G.cups.has(destKey)){
      G.cups.delete(destKey);
      if(p.type !== 'q'){ p.type = 'q'; log(`🏆 Кубок! Фигура стала ферзём.`); }
    }
    if(G.greenFlags.has(destKey) && p.type==='k'){
      G.greenFlags.delete(destKey);
      p.type = 'q';
      log(`🏁 Король подобрал зелёный флаг и стал ферзём!`);
      ensureKings();
    }
    if(G.letters.has(destKey)){
      const letter = G.letters.get(destKey);
      G.letters.delete(destKey);
      p.yellow = true;
      log(`🃏 Фигура подобрала букву ${letter} и стала жёлтой!`);
    }
    if(G.houses.has(destKey) && p.type === 'b'){
      G.houses.delete(destKey);
      p.type = 'r';
      log(`🏠 Слон стал ладьёй (Монополия).`);
    }
    applySuitEffect(p, m.to.r, m.to.c);

    // Превосходство: король на жёлтой клетке → шашка появляется в начале доски, клетка становится обычной
    if(p.type === 'k' && G.goldCells.has(destKey)){
      G.goldCells.delete(destKey);
      const startRow = p.color==='w' ? G.maxR : G.minR;
      let placed = false;
      for(let c=G.minC;c<=G.maxC;c++){
        if(!G.board[startRow][c] && !isBlockedCell(startRow,c)){
          const np = mk(p.color, 'c');
          np.moved = true;
          G.board[startRow][c] = np;
          log(`⭐ Превосходство: король собрал жёлтую клетку — на ${sqName(startRow,c)} появилась шашка.`);
          placed = true;
          break;
        }
      }
      if(!placed) log('⭐ Превосходство: не нашлось места для шашки.');
    }

    // Алгебра: король собирает цифры по порядку
    if(p.type === 'k' && G.algebraMap.has(destKey)){
      const num = G.algebraMap.get(destKey);
      const expected = G.algebraCollected[p.color] + 1;
      if(num === expected){
        G.algebraMap.delete(destKey);
        G.algebraCollected[p.color] = num;
        log(`🔢 Король ${p.color==='w'?'белых':'чёрных'} собрал цифру ${num} (${num}/3).`);
        if(G.algebraCollected[p.color] === 3){
          // все фигуры противника исчезают
          const enemyColor = oppOf(p.color);
          let removed = 0;
          for(const e of allPieces(enemyColor)){
            if(e.p.type !== 'k'){
              setPieceAt(e.r, e.c, e.b2, null);
              removed++;
            }
          }
          log(`🔢 Алгебра! Король собрал 1-2-3. Исчезло фигур противника: ${removed}.`);
          G.algebraCollected[p.color] = 0;
          G.algebraMap.clear();
        }
      } else {
        log(`🔢 Неверная цифра: нужно ${expected}, а на клетке ${num}.`);
      }
    }
  }

  if(u.captured && G.eff.captureLosePawn[p.color] > 0){
    G.eff.captureLosePawn[p.color]--;
    const o = oppOf(p.color);
    const pawns = allPieces(o).filter(x=>x.p.type==='p');
    if(pawns.length){
      const t = pick(pawns);
      G.board[t.r][t.c] = null;
      log(`💀 Противник теряет пешку.`);
    }
  }

  let boom = false;
  if(!m.toBoard2){
    const kk = key(m.to.r, m.to.c);
    if(G.mines.has(kk)){ G.mines.delete(kk); boom = true; log('💣 Сработала мина!'); }
    else if(G.flags.has(kk)){
      if(Math.random() < 0.5){ boom = true; log('🚩 Флажок взорвался!'); }
      else log('🚩 Флажок не сработал.');
    }
  }

  if(boom){
    if(p.type==='k'){ log('👑 Король невредим.'); }
    else { setPieceAt(m.to.r, m.to.c, !!m.toBoard2, null); log('💥 Фигура уничтожена.'); }
  }

  G.selected = null;
  G.legal = [];
  endTurn();
}

function useCard(color, id){
  if(G.over || G.turn!==color) return;
  if(G.cardUsedThisTurn[color] || !G.canUseCard[color]) return;
  const idx = G.hands[color].indexOf(id);
  if(idx < 0) return;

  G.hands[color].splice(idx,1);
  G.cardUsedThisTurn[color] = true;
  G.pendingBlock[color] = true;
  G.drawCounter[color] = 2;

  applyCard(color, id);

  G.selected = null;
  G.legal = [];
  evaluate();
  render();
}

function log(msg){
  if(!G) return;
  G.log.unshift(msg);
  if(G.log.length > 40) G.log.pop();
}

/* ============================ ОТРИСОВКА ============================ */
function computeCellSize(){
  const W = G.maxC - G.minC + 1;
  const H = G.maxR - G.minR + 1;
  const sideW = 380;
  const availW = Math.max(280, window.innerWidth - sideW - 90);
  const availH = Math.max(280, window.innerHeight - 150);
  let cell = Math.floor(Math.min(availW/W, availH/H));
  if(G.b2Active){
    const W2 = G.b2.maxC - G.b2.minC + 1;
    const H2 = G.b2.maxR - G.b2.minR + 1;
    const cellSide = Math.floor(Math.min(availW/(W + W2), availH/Math.max(H, H2)));
    cell = Math.min(cell, cellSide);
  }
  return Math.max(20, Math.min(68, cell));
}

function render(){
  const cell = computeCellSize();
  renderMainBoard(cell);
  renderSecondBoard(cell);
  renderPanels();
  renderStatus();
  renderLog();
}

function applySuitClass(cellEl, r, c){
  const suit = G.suits.get(key(r,c));
  if(!suit) return;
  if(suit === 'hearts') cellEl.style.background = '#b71c1c';
  else if(suit === 'diamonds') cellEl.style.background = '#d84315';
  else if(suit === 'clubs') cellEl.style.background = '#4a148c';
  else if(suit === 'spades') cellEl.style.background = '#1a237e';
}

function appendSuitMarker(cellEl, r, c){
  const suit = G.suits.get(key(r,c));
  if(!suit) return;
  const symbols = {hearts:'♥', diamonds:'♦', clubs:'♣', spades:'♠'};
  const colors = {hearts:'#ff5252', diamonds:'#ffab40', clubs:'#e1bee7', spades:'#b3e5fc'};
  const e = document.createElement('span');
  e.className = 'marker-suit';
  e.textContent = symbols[suit];
  e.style.color = colors[suit];
  cellEl.appendChild(e);
}

function renderMainBoard(cell){
  const W = G.maxC - G.minC + 1;
  const boardEl = document.getElementById('board');
  boardEl.style.setProperty('--cell', cell + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${W}, ${cell}px)`;
  boardEl.innerHTML = '';
  const frag = document.createDocumentFragment();

  for(let r=G.minR; r<=G.maxR; r++){
    for(let c=G.minC; c<=G.maxC; c++){
      const cellEl = document.createElement('div');
      cellEl.className = 'cell ' + (((r+c)%2) ? 'dark' : 'light');
      cellEl.dataset.r = r; cellEl.dataset.c = c; cellEl.dataset.b2 = 'false';

      const k = key(r,c);
      if(G.blocked.has(k)) cellEl.classList.add('blocked');
      if(G.greenCells.has(k)) cellEl.classList.add('green');
      if(G.blueCells.has(k)) cellEl.classList.add('blue');
      if(G.redCells.has(k)) cellEl.classList.add('red');
      if(G.fire.has(k)) cellEl.classList.add('fire');
      if(G.circles.has(k)) cellEl.classList.add('circle');
      if(G.clubsZones.has(k)) cellEl.classList.add('clubsZone');
      if(G.sunCells.has(k)) cellEl.classList.add('sun');
      if(G.moonCells.has(k)) cellEl.classList.add('moon');
      if(G.endgameCells.has(k)) cellEl.classList.add('endgame');
      if(G.goldCells.has(k)) cellEl.classList.add('gold');
      if(G.wifiCells.has(k)) cellEl.classList.add('wifi');
      if(G.dynamiteMap.has(k)) cellEl.classList.add('dynamite');
      if(G.meteorCells.has(k)) cellEl.classList.add('meteor');
      applySuitClass(cellEl, r, c);

      if(G.lastMove && !G.lastMove.fromB2 && G.lastMove.from.r===r && G.lastMove.from.c===c) cellEl.classList.add('lastmove');
      if(G.lastMove && !G.lastMove.toB2 && G.lastMove.to.r===r && G.lastMove.to.c===c) cellEl.classList.add('lastmove');
      if(G.selected && !G.selected.b2 && G.selected.r===r && G.selected.c===c) cellEl.classList.add('selected');

      const mv = G.legal.find(m=>m.to.r===r && m.to.c===c && !m.toBoard2);
      if(mv) cellEl.classList.add((G.board[r][c] || mv.enPassant) ? 'capture' : 'movehint');

      const p = G.board[r][c];
      if(p){
        const sp = document.createElement('span');
        sp.className = 'piece ' + (p.color==='w' ? 'pw' : p.color==='b' ? 'pb' : 'pneutral');
        sp.dataset.type = p.type;
        if(p.statue !== 0) sp.classList.add('statue');
        if(p.type==='p' && G.eff.pawnsInvisible>0) sp.classList.add('ghost');
        if(p.canCaptureForward && p.type==='p') sp.classList.add('berserk');
        if(p.yellow) sp.classList.add('yellow');
        if(p.suitKnightTurns>0 || p.suitRookTurns>0 || p.tempBishopTurns>0) sp.classList.add('suited');
        if(p.type==='ghost') sp.classList.add('ghost-piece');
        if(p.type==='demon') sp.classList.add('demon-piece');
        if(p.isMonarch) sp.classList.add('purple');
        if(p.isAngel) sp.classList.add('holy');
        if(p.isEye) sp.classList.add('eye');
        sp.textContent = PIECE_CHARS[p.type] || '?';
        cellEl.appendChild(sp);

        if(p.type === 'k' && G.clownHat[p.color]){
          const hat = document.createElement('span');
          hat.textContent = '🤡';
          hat.style.position = 'absolute'; hat.style.top = '0'; hat.style.right = '0';
          hat.style.fontSize = 'calc(var(--cell)*0.4)';
          hat.style.pointerEvents = 'none'; hat.style.zIndex = '5';
          cellEl.appendChild(hat);
        }
      } else {
        if(G.mines.has(k)){ const e=document.createElement('span'); e.className='marker'; e.textContent='💣'; cellEl.appendChild(e); }
        else if(G.flags.has(k)){ const e=document.createElement('span'); e.className='marker'; e.textContent='🚩'; cellEl.appendChild(e); }
        else if(G.cups.has(k)){ const e=document.createElement('span'); e.className='marker'; e.textContent='🏆'; cellEl.appendChild(e); }
        else if(G.greenFlags.has(k)){ const e=document.createElement('span'); e.className='marker'; e.textContent='🏁'; cellEl.appendChild(e); }
        else if(G.letters.has(k)){
          const e=document.createElement('span'); e.className='marker';
          e.textContent=G.letters.get(k); e.style.color='#ffeb3b'; e.style.fontWeight='bold';
          cellEl.appendChild(e);
        }
        else if(G.houses.has(k)){ const e=document.createElement('span'); e.className='marker'; e.textContent='🏠'; cellEl.appendChild(e); }
      }
      if(G.barracks.has(k)){ const e=document.createElement('span'); e.className='marker'; e.textContent='🏛'; e.style.right='2px'; e.style.bottom='2px'; e.style.left='auto'; e.style.top='auto'; cellEl.appendChild(e); }

      // Маркеры разных карт
      if(G.dynamiteMap.has(k)){
        const e = document.createElement('span'); e.className='marker'; e.textContent='🧨';
        e.style.left = '2px'; e.style.top = 'auto'; e.style.bottom = '2px';
        cellEl.appendChild(e);
      }
      if(G.wifiCells.has(k)){
        const e = document.createElement('span'); e.className='marker'; e.textContent='📶';
        e.style.right='2px'; e.style.top='2px'; e.style.left='auto';
        cellEl.appendChild(e);
      }
      if(G.meteorCells.has(k)){
        const e = document.createElement('span'); e.className='marker'; e.textContent='☄';
        e.style.right='2px'; e.style.bottom='2px'; e.style.left='auto'; e.style.top='auto';
        cellEl.appendChild(e);
      }
      if(G.algebraMap.has(k)){
        const e = document.createElement('span'); e.className='marker-num';
        e.textContent = G.algebraMap.get(k);
        cellEl.appendChild(e);
      }

      if(G.sunCells.has(k)){ const e = document.createElement('span'); e.className = 'marker-sun'; e.textContent = '☀'; cellEl.appendChild(e); }
      if(G.moonCells.has(k)){ const e = document.createElement('span'); e.className = 'marker-sun'; e.textContent = '🌙'; cellEl.appendChild(e); }
      appendSuitMarker(cellEl, r, c);

      if(G.b2Active){
        const L = getLinkFromMain(r,c);
        if(L){ const e = document.createElement('span'); e.className = 'marker-portal'; e.textContent = '🌀'; cellEl.appendChild(e); }
      }
      if(G.portals.length === 2){
        for(const pt of G.portals){
          if(pt.r===r && pt.c===c){
            const e = document.createElement('span');
            e.className = 'marker-portal'; e.textContent = '🌀';
            e.style.left = 'auto'; e.style.right = '2px';
            cellEl.appendChild(e);
          }
        }
      }

      if(r === G.maxR){ const l = document.createElement('span'); l.className = 'coord file'; l.textContent = String.fromCharCode(97 + (c-G.minC)); cellEl.appendChild(l); }
      if(c === G.minC){ const l = document.createElement('span'); l.className = 'coord rank'; l.textContent = String(G.maxR - r + 1); cellEl.appendChild(l); }
      frag.appendChild(cellEl);
    }
  }
  boardEl.appendChild(frag);
}

function renderSecondBoard(cell){
  const el = document.getElementById('board2');
  if(!G.b2Active){ el.style.display = 'none'; return; }
  el.style.display = 'grid';
  el.style.setProperty('--cell', cell + 'px');
  const W2 = G.b2.maxC - G.b2.minC + 1;
  el.style.gridTemplateColumns = `repeat(${W2}, ${cell}px)`;
  el.innerHTML = '';
  const frag = document.createDocumentFragment();

  for(let r=G.b2.minR; r<=G.b2.maxR; r++){
    for(let c=G.b2.minC; c<=G.b2.maxC; c++){
      const cellEl = document.createElement('div');
      cellEl.className = 'cell ' + (((r+c)%2) ? 'dark' : 'light');
      cellEl.dataset.r = r; cellEl.dataset.c = c; cellEl.dataset.b2 = 'true';

      if(G.lastMove && G.lastMove.fromB2 && G.lastMove.from.r===r && G.lastMove.from.c===c) cellEl.classList.add('lastmove');
      if(G.lastMove && G.lastMove.toB2 && G.lastMove.to.r===r && G.lastMove.to.c===c) cellEl.classList.add('lastmove');
      if(G.selected && G.selected.b2 && G.selected.r===r && G.selected.c===c) cellEl.classList.add('selected');

      const mv = G.legal.find(m=>m.to.r===r && m.to.c===c && m.toBoard2);
      if(mv) cellEl.classList.add(G.board2[r][c] ? 'capture' : 'movehint');

      const p = G.board2[r][c];
      if(p){
        const sp = document.createElement('span');
        sp.className = 'piece ' + (p.color==='w' ? 'pw' : p.color==='b' ? 'pb' : 'pneutral');
        sp.dataset.type = p.type;
        if(p.statue !== 0) sp.classList.add('statue');
        if(p.type==='p' && G.eff.pawnsInvisible>0) sp.classList.add('ghost');
        if(p.canCaptureForward && p.type==='p') sp.classList.add('berserk');
        if(p.yellow) sp.classList.add('yellow');
        if(p.suitKnightTurns>0 || p.suitRookTurns>0 || p.tempBishopTurns>0) sp.classList.add('suited');
        if(p.type==='ghost') sp.classList.add('ghost-piece');
        if(p.type==='demon') sp.classList.add('demon-piece');
        if(p.isMonarch) sp.classList.add('purple');
        if(p.isAngel) sp.classList.add('holy');
        if(p.isEye) sp.classList.add('eye');
        sp.textContent = PIECE_CHARS[p.type] || '?';
        cellEl.appendChild(sp);
      }

      const L = getLinkFromSecond(r,c);
      if(L){ const e = document.createElement('span'); e.className = 'marker-portal'; e.textContent = '🌀'; cellEl.appendChild(e); }

      frag.appendChild(cellEl);
    }
  }
  el.appendChild(frag);
}

function renderStatus(){
  const el = document.getElementById('status');
  if(G.over){
    el.textContent = G.msg;
    el.className = 'status over';
    return;
  }
  if(G.endgameActive){
    el.textContent = '⚡ ТУПИКОВАЯ РЕАЛЬНОСТЬ — заполните 4 золотые клетки!';
    el.className = 'status reality';
    return;
  }
  let s = G.turn==='w' ? 'Ход белых' : 'Ход чёрных';
  const k = findKing(G.turn);
  if(k && G.eff.kingImmune[G.turn]<=0 && isAttackedBoard(k.r,k.c,oppOf(G.turn), !!k.b2)) s += ' — ШАХ!';
  if(G.eff.kingImmune[G.turn] > 0) s += ' (король неуязвим)';
  if(G.eff.blitz > 0) s += ' ⏱';
  if(G.eff.dnd > 0) s += ' 🎲';
  if(G.eff.unbounded && G.eff.unboundedDelay > 0) s += ' ♾(част.) ' + Math.ceil(G.eff.unboundedDelay/2);
  if(G.b2Active) s += ' 🔮';
  el.textContent = s;
  el.className = 'status' + (s.indexOf('ШАХ') >= 0 ? ' check' : '');
}

function renderPanels(){
  for(const color of ['w','b']){
    const el = document.getElementById(color==='w' ? 'panelW' : 'panelB');
    el.classList.toggle('active', G.turn===color && !G.over);
    const cardsEl = el.querySelector('.cards');
    cardsEl.innerHTML = '';
    for(const id of G.hands[color]){
      const card = CARDS.find(c=>c.id===id);
      if(!card) continue;
      const d = document.createElement('div');
      d.className = 'card';
      const canUse = (G.turn===color) && !G.over &&
                     !G.cardUsedThisTurn[color] && G.canUseCard[color];
      if(!canUse) d.classList.add('disabled');
      d.innerHTML =
        '<div class="cicon">' + card.icon + '</div>' +
        '<div class="cname">' + card.name + '</div>' +
        '<div class="cdesc">' + card.desc + '</div>';
      d.addEventListener('click', function(){ if(canUse) useCard(color, id); });
      cardsEl.appendChild(d);
    }
    if(G.hands[color].length === 0){
      const e = document.createElement('div');
      e.className = 'cdesc';
      e.style.padding = '4px 2px';
      e.textContent = 'Карточек нет.';
      cardsEl.appendChild(e);
    }
  }
}

function renderLog(){
  const el = document.getElementById('log');
  el.innerHTML = '';
  for(const line of G.log){
    const d = document.createElement('div');
    d.textContent = line;
    el.appendChild(d);
  }
}

/* ============================ ВВОД ============================ */
function onCellClick(r, c, b2){
  if(G.over) return;
  b2 = !!b2;
  const mv = G.legal.find(m => m.to.r===r && m.to.c===c && (!!m.toBoard2 === b2));
  if(mv){ doMove(mv); return; }

  const p = b2 ? G.board2[r][c] : G.board[r][c];
  if(p && p.color===G.turn){
    G.selected = {r,c,b2};
    const all = legalMoves(G.turn);
    G.legal = all.filter(m => m.from.r===r && m.from.c===c && (!!m.fromBoard2 === b2));
    render();
    return;
  }
  G.selected = null;
  G.legal = [];
  render();
}

/* ============================ НОВАЯ ИГРА ============================ */
function setupPieces(){
  const back = ['r','n','b','q','k','b','n','r'];
  const b = G.board;
  for(let i=0;i<8;i++){
    b[INIT.minR][INIT.minC+i]     = mk('b', back[i]);
    b[INIT.minR+1][INIT.minC+i]   = mk('b','p');
    b[INIT.maxR][INIT.minC+i]     = mk('w', back[i]);
    b[INIT.maxR-1][INIT.minC+i]   = mk('w','p');
  }
}

    eff: {

      knightsBackward: 0,

      pawnsInvisible: 0,

      cardLock: {w:0, b:0},

  };

  setupPieces();

  const start = shuffle(CARDS.map(c=>c.id)).slice(0,3);
  G.hands.w = start.slice();
  G.hands.b = start.slice();

  beginTurn();
  log('Новая партия. У каждого игрока по 3 одинаковые карточки.');
  render();
}

/* ============================ ЗАПУСК ============================ */
document.getElementById('board').addEventListener('click', function(e){
  const cell = e.target.closest('.cell');
  if(!cell) return;
  const r = parseInt(cell.dataset.r, 10);
  const c = parseInt(cell.dataset.c, 10);
  if(isNaN(r) || isNaN(c)) return;
  onCellClick(r, c, false);
});
document.getElementById('board2').addEventListener('click', function(e){
  const cell = e.target.closest('.cell');
  if(!cell) return;
  const r = parseInt(cell.dataset.r, 10);
  const c = parseInt(cell.dataset.c, 10);
  if(isNaN(r) || isNaN(c)) return;
  onCellClick(r, c, true);
});
document.getElementById('newGameBtn').addEventListener('click', function(){ newGame(); });
window.addEventListener('resize', function(){ if(G) render(); });

newGame();

})();
