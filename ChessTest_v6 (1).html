<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess 2</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 25% 5%, #1c2a46 0%, #0a0e18 65%);
    color:#e6edfb;
    min-height:100vh;
    overflow-x:hidden;
  }
  header{
    display:flex;align-items:center;gap:18px;
    padding:14px 26px 10px;
    flex-wrap:wrap;
  }
  h1{
    margin:0;font-size:22px;letter-spacing:3px;font-weight:800;
    background:linear-gradient(90deg,#7fd1ff,#b58cff 60%,#ff9ecd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1 span{opacity:.85;}
  .status{
    font-size:14px;font-weight:600;padding:7px 16px;border-radius:20px;
    background:rgba(255,255,255,.06);border:1px solid rgba(140,180,255,.2);
    transition:.25s;
  }
  .status.check{background:rgba(255,80,80,.18);border-color:rgba(255,110,110,.65);color:#ffb3b3;box-shadow:0 0 18px rgba(255,60,60,.35);}
  .status.over{background:rgba(120,255,190,.15);border-color:rgba(120,255,190,.6);color:#a9ffd8;box-shadow:0 0 22px rgba(80,255,180,.3);}
  .status.reality{background:rgba(255,200,60,.2);border-color:rgba(255,220,100,.75);color:#ffe082;box-shadow:0 0 22px rgba(255,200,60,.5);}
  header button{
    margin-left:auto;padding:8px 18px;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#3d63b8,#7a4fd0);color:#fff;font-weight:600;
    border:1px solid rgba(180,200,255,.35);font-size:13px;transition:.2s;
  }
  header button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(90,110,255,.4);}

  .main{
    display:flex;gap:22px;padding:6px 26px 26px;align-items:flex-start;
    flex-wrap:wrap;
  }
  .boardArea{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-start;gap:18px;flex-wrap:wrap;}
  #board{
    display:grid;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.7), 0 0 0 3px #2b3550, 0 0 0 4px rgba(120,160,255,.15);
    background:#1a2132;
  }
  #board2{
    display:none;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 26px 60px rgba(0,0,0,.7), 0 0 0 3px #4a3060, 0 0 0 4px rgba(180,120,255,.25);
    background:#1a2132;
    align-self:flex-start;
  }
  .cell{
    width:var(--cell);height:var(--cell);
    position:relative;display:flex;align-items:center;justify-content:center;
    user-select:none;
  }
  .cell.light{background:#cbd8ea;}
  .cell.dark{background:#5a6d8c;}
  .cell.blocked{background:#171b25 !important;}
  .cell.blocked::after{
    content:'✕';position:absolute;font-size:calc(var(--cell)*0.42);
    color:#4a5266;font-weight:700;
  }
  .cell.green{background:#2e7d32 !important;}
  .cell.blue{background:#1565c0 !important;}
  .cell.red{background:#c62828 !important;}
  .cell.fire{background:#ff6d00 !important; box-shadow:inset 0 0 12px #ffab00;}
  .cell.circle{background:#1e88e5 !important; box-shadow:inset 0 0 8px #90caf9;}
  .cell.clubsZone{box-shadow:inset 0 0 0 2px rgba(120,60,180,.55);}
  .cell.sun{background:#ffb300 !important; box-shadow:inset 0 0 16px #fff176;}
  .cell.moon{background:#263238 !important; box-shadow:inset 0 0 16px #90a4ae;}
  .cell.endgame{box-shadow:inset 0 0 0 3px gold, inset 0 0 20px rgba(255,215,0,.6);}
  .cell.gold{background:#ffd54f !important; box-shadow:inset 0 0 0 3px #ffb300, inset 0 0 16px #ffeb3b;}
  .cell.wifi{background:#00acc1 !important; box-shadow:inset 0 0 14px #4dd0e1;}
  .cell.dynamite{background:#5d4037 !important; box-shadow:inset 0 0 18px #ff5722;}
  .cell.meteor{background:#424242 !important; box-shadow:inset 0 0 14px #ff8a65;}
  .cell.lastmove{box-shadow:inset 0 0 0 100px rgba(255,214,120,.22);}
  .cell.selected{box-shadow:inset 0 0 0 3px #ffd166, inset 0 0 0 100px rgba(255,209,102,.18);}
  .cell.movehint::after{
    content:'';position:absolute;width:28%;height:28%;border-radius:50%;
    background:rgba(70,230,150,.75);box-shadow:0 0 14px rgba(70,230,150,.85);
  }
  .cell.capture::after{
    content:'';position:absolute;inset:7%;border-radius:50%;
    border:3px solid rgba(255,90,90,.85);box-shadow:0 0 14px rgba(255,80,80,.6);
  }
  .piece{
    font-size:calc(var(--cell)*0.84);
    line-height:1;user-select:none;pointer-events:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));
    transition:opacity .3s;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .piece[data-type="p"]{ font-size:calc(var(--cell)*0.62); }
  .piece[data-type="c"]{ font-size:calc(var(--cell)*1.05); line-height:1; }
  .piece[data-type="dino"]{ font-size:calc(var(--cell)*0.68); }
  .piece[data-type="bowl"]{ font-size:calc(var(--cell)*0.5); }
  .piece[data-type="ghost"]{ font-size:calc(var(--cell)*0.78); }
  .piece[data-type="dragon"]{ font-size:calc(var(--cell)*0.82); }
  .piece[data-type="monolith"]{ font-size:calc(var(--cell)*0.78); }
  .piece[data-type="demon"]{ font-size:calc(var(--cell)*0.78); }
  .piece.pw{color:#ffffff;-webkit-text-stroke:1.4px #2b3448;}
  .piece.pb{color:#161c2b;-webkit-text-stroke:1.4px #93a2bd;}
  .piece.statue{filter:grayscale(1) brightness(.65);opacity:.8;}
  .piece.ghost{opacity:.85;}
  .piece.berserk{filter:drop-shadow(0 0 8px rgba(255,80,80,.9));}
  .piece.yellow{filter:drop-shadow(0 0 8px #ffeb3b);}
  .piece.suited{filter:drop-shadow(0 0 7px #00e5ff);}
  .piece.pw.ghost-piece{filter:drop-shadow(0 0 10px #ffeb3b) brightness(1.4);}
  .piece.pb.ghost-piece{filter:drop-shadow(0 0 10px #2196f3) brightness(1.4);}
  .piece.demon-piece{filter:drop-shadow(0 0 8px #d32f2f);}
  .piece.purple{filter:drop-shadow(0 0 8px #9c27b0) hue-rotate(270deg);}
  .piece.holy{filter:drop-shadow(0 0 10px #fff59d) brightness(1.3);}
  .piece.eye{filter:drop-shadow(0 0 10px #8e24aa);}
  .marker{
    position:absolute;font-size:calc(var(--cell)*0.5);pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
  }
  .marker-portal{
    position:absolute;font-size:calc(var(--cell)*0.35);pointer-events:none;
    top:2px;left:2px;opacity:.9;
  }
  .marker-suit{
    position:absolute;font-size:calc(var(--cell)*0.34);pointer-events:none;
    top:1px;left:2px;opacity:.95;font-weight:900;
    text-shadow:0 1px 2px rgba(0,0,0,.7);
  }
  .marker-sun{
    position:absolute;font-size:calc(var(--cell)*0.34);pointer-events:none;
    top:1px;right:2px;opacity:.95;
  }
  .marker-num{
    position:absolute;font-size:calc(var(--cell)*0.42);pointer-events:none;
    top:50%;left:50%;transform:translate(-50%,-50%);
    color:#ffe082;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.9);
  }
  .coord{position:absolute;font-size:9px;font-weight:700;color:rgba(0,0,0,.42);pointer-events:none;}
  .dark .coord{color:rgba(255,255,255,.55);}
  .coord.file{right:3px;bottom:1px;}
  .coord.rank{left:3px;top:1px;}

  .side{width:340px;display:flex;flex-direction:column;gap:12px;flex:1 1 300px;max-width:400px;}
  .panel{
    background:rgba(19,27,44,.75);
    border:1px solid rgba(120,160,220,.16);
    border-radius:14px;padding:10px 12px;
    backdrop-filter:blur(9px);
    transition:.25s;
  }
  .panel.active{
    border-color:rgba(110,230,170,.6);
    box-shadow:0 0 26px rgba(70,220,150,.18), inset 0 0 22px rgba(70,220,150,.05);
  }
  .phead{font-size:13px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;margin-bottom:8px;color:#c3d3ee;text-transform:uppercase;}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .dot.white{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8);}
  .dot.black{background:#0e1320;border:1px solid #7d8aa5;}
  .cards{display:flex;flex-direction:column;gap:7px;}
  .card{
    display:grid;grid-template-columns:40px 1fr;align-items:center;
    gap:0 10px;padding:7px 10px;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,rgba(90,130,200,.24),rgba(140,100,220,.16));
    border:1px solid rgba(140,180,255,.22);
    transition:.15s;
  }
  .card:hover{transform:translateY(-2px);border-color:rgba(160,210,255,.65);box-shadow:0 6px 18px rgba(0,0,0,.45);}
  .card.disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.75);}
  .card.disabled:hover{transform:none;box-shadow:none;border-color:rgba(140,180,255,.22);}
  .cicon{grid-row:1/3;font-size:25px;text-align:center;line-height:1;}
  .cname{font-size:12.5px;font-weight:700;color:#dbe8ff;}
  .cdesc{font-size:10.5px;color:#93a4c4;line-height:1.3;}
  .logPanel{max-height:190px;display:flex;flex-direction:column;}
  .log{overflow-y:auto;font-size:11px;line-height:1.55;color:#9fb0cf;display:flex;flex-direction:column;gap:2px;}
  .log div{border-bottom:1px dashed rgba(120,160,220,.1);padding-bottom:2px;}
  .log::-webkit-scrollbar{width:6px;}
  .log::-webkit-scrollbar-thumb{background:rgba(120,160,220,.3);border-radius:3px;}
  @media(max-width:860px){
    .main{padding:6px 10px 20px;gap:12px;}
    .side{width:100%;max-width:none;}
    header{padding:10px 14px;}
  }
</style>
</head>
<body>
<header>
  <h1>CHESS <span>2</span></h1>
  <div id="status" class="status">Ход белых</div>
  <button id="newGameBtn">Новая игра</button>
</header>

<div class="main">
  <div class="boardArea">
    <div id="board"></div>
    <div id="board2"></div>
  </div>
  <aside class="side">
    <section class="panel" id="panelB">
      <div class="phead"><span class="dot black"></span> Чёрные</div>
      <div class="cards"></div>
    </section>
    <section class="panel" id="panelW">
      <div class="phead"><span class="dot white"></span> Белые</div>
      <div class="cards"></div>
    </section>
    <section class="panel logPanel">
      <div class="phead">Журнал</div>
      <div id="log" class="log"></div>
    </section>
  </aside>
</div>

/* ============================ СОСТОЯНИЕ ============================ */
let uid = 1;
let G = null;

function key(r,c){ return r+','+c; }
function oppOf(c){ return c==='w'?'b':'w'; }
function mk(color,type){
  return {id:uid++, color, type, moved:false, statue:0, canCaptureForward:false,
          tempQueen:0, frozen:0, yellow:false, 
          suitKnightTurns:0, suitRookTurns:0, tempBishopTurns:0, originalType:null,
          ghostTurns:0,
          isMonarch:false, isAngel:false, isEye:false,
          anchorTurns:0};
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function sqName(r,c,b2){ 
  if(b2) return 'B2:' + String.fromCharCode(97 + (c - G.b2.minC)) + (G.b2.maxR - r + 1);
  return String.fromCharCode(97 + (c - G.minC)) + (G.maxR - r + 1);
}

function inB(r,c){ return r>=G.minR && r<=G.maxR && c>=G.minC && c<=G.maxC; }
function inB2(r,c){ return r>=G.b2.minR && r<=G.b2.maxR && c>=G.b2.minC && c<=G.b2.maxC; }
function isBlockedCell(r,c){ return G.blocked.has(key(r,c)) || G.fire.has(key(r,c)); }
function isGreenBlue(r,c){ return G.greenCells.has(key(r,c)) || G.blueCells.has(key(r,c)); }
function isClubsRestricted(r,c,pieceType){
  if(!G.clubsZones.has(key(r,c))) return false;
  return pieceType === 'k' || pieceType === 'p' || pieceType === 'n';
}
function isSunForbidden(r,c,pieceColor){
  if(G.sunCells.has(key(r,c)) && pieceColor === 'b') return true;
  if(G.moonCells.has(key(r,c)) && pieceColor === 'w') return true;
  return false;
}
function isInvulnerable(p){ return p && p.type === 'ghost'; }
function isDragonImmuneTo(attackerType, targetType){
  return targetType === 'dragon' && (attackerType === 'n' || attackerType === 'b');
}
function wrapTo(r,c){
  const H = G.maxR - G.minR + 1;
  const W = G.maxC - G.minC + 1;
  const nr = ((r - G.minR) % H + H) % H + G.minR;
  const nc = ((c - G.minC) % W + W) % W + G.minC;
  return {r: nr, c: nc};
}
function canWrapPiece(p){
  if(!G.eff.unbounded) return false;
  if(p.type === 'p') return false;
  if(G.eff.unboundedDelay > 0){
    if(p.type === 'k' || p.type === 'q' || p.type === 'b' || p.type === 'n') return false;
  }
  return true;
}
function canEnterCell(r,c,p){
  if(p.isAngel) return true;
  if(isBlockedCell(r,c)) return false;
  if(isGreenBlue(r,c) && p.type === 'n') return false;
  if(isClubsRestricted(r,c,p.type)) return false;
  return true;
}

function allPieces(color, includeB2){
  const out=[];
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    const p=G.board[r][c];
    if(p && (!color || p.color===color) && p.color !== 'n') out.push({p,r,c,b2:false});
  }
  if(includeB2 && G.b2Active){
    for(let r=G.b2.minR;r<=G.b2.maxR;r++) for(let c=G.b2.minC;c<=G.b2.maxC;c++){
      const p=G.board2[r][c];
      if(p && (!color || p.color===color) && p.color !== 'n') out.push({p,r,c,b2:true});
    }
  }
  return out;
}
function findPiece(color,type){
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    const p=G.board[r][c];
    if(p && p.color===color && p.type===type) return {p,r,c,b2:false};
  }
  if(G.b2Active){
    for(let r=G.b2.minR;r<=G.b2.maxR;r++) for(let c=G.b2.minC;c<=G.b2.maxC;c++){
      const p=G.board2[r][c];
      if(p && p.color===color && p.type===type) return {p,r,c,b2:true};
    }
  }
  return null;
}
function findKing(color){
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    const p=G.board[r][c];
    if(p && p.color===color && p.type==='k') return {r,c,b2:false};
  }
  if(G.b2Active){
    for(let r=G.b2.minR;r<=G.b2.maxR;r++) for(let c=G.b2.minC;c<=G.b2.maxC;c++){
      const p=G.board2[r][c];
      if(p && p.color===color && p.type==='k') return {r,c,b2:true};
    }
  }
  return null;
}
function emptyCells(){
  const out=[];
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    if(!G.board[r][c] && !G.blocked.has(key(r,c)) && !G.fire.has(key(r,c))) out.push({r,c});
  }
  return out;
}
function emptyCells2(){
  const out=[];
  if(!G.b2Active) return out;
  for(let r=G.b2.minR;r<=G.b2.maxR;r++) for(let c=G.b2.minC;c<=G.b2.maxC;c++){
    if(!G.board2[r][c]) out.push({r,c});
  }
  return out;
}
function trulyFreeCells(){
  const out=[];
  for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
    if(!G.board[r][c] && !G.blocked.has(key(r,c)) && !G.fire.has(key(r,c))
       && !G.greenCells.has(key(r,c)) && !G.blueCells.has(key(r,c))) out.push({r,c});
  }
  return out;
}
function getLinkFromMain(r,c){
  if(!G.b2Active) return null;
  for(const L of G.b2Links) if(L.main.r===r && L.main.c===c) return L;
  return null;
}
function getLinkFromSecond(r,c){
  if(!G.b2Active) return null;
  for(const L of G.b2Links) if(L.second.r===r && L.second.c===c) return L;
  return null;
}

/* ========== ВОССТАНОВЛЕНИЕ КОРОЛЕЙ ========== */
function ensureKings(){
  let restored = false;
  for(const col of ['w','b']){
    const k = findKing(col);
    let needsRespawn = false;
    if(!k){
      needsRespawn = true;
      log(`⚠️ Король ${col==='w'?'белых':'чёрных'} пропал — восстановление...`);
    } else if(!k.b2 && (G.blocked.has(key(k.r, k.c)) || G.fire.has(key(k.r, k.c)))){
      G.board[k.r][k.c] = null;
      needsRespawn = true;
      log(`⚠️ Король ${col==='w'?'белых':'чёрных'} оказался в опасной зоне — пересадка...`);
    }
    if(needsRespawn){
      let cells = trulyFreeCells();
      if(cells.length === 0) cells = emptyCells();
      if(cells.length === 0 && G.b2Active){
        const c2 = emptyCells2();
        if(c2.length) cells = c2;
      }
      if(cells.length === 0){
        for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++) cells.push({r,c});
      }
      if(cells.length > 0){
        const t = pick(cells);
        if(G.board[t.r] && G.board[t.r][t.c]) G.board[t.r][t.c] = null;
        const np = mk(col, 'k');
        np.moved = true;
        G.board[t.r][t.c] = np;
        log(`✅ Король ${col==='w'?'белых':'чёрных'} появился на ${sqName(t.r,t.c)}.`);
        restored = true;
      }
    }
  }
  return restored;
}

/* ============================ ГЕНЕРАЦИЯ ХОДОВ ============================ */
function slideMoves(r,c,p,dirs){
  if(canWrapPiece(p)){
    const res = [];
    const H = G.maxR - G.minR + 1;
    const W = G.maxC - G.minC + 1;
    const maxSteps = H * W;
    for(const [dr,dc] of dirs){
      let tr = r, tc = c;
      const seen = new Set([key(tr,tc)]);
      for(let step = 0; step < maxSteps; step++){
        const w = wrapTo(tr + dr, tc + dc);
        tr = w.r; tc = w.c;
        if(seen.has(key(tr,tc))) break;
        seen.add(key(tr,tc));
        if(!canEnterCell(tr,tc,p)) break;
        if((p.type==='q'||p.type==='r'||p.type==='bowl') && G.circles.has(key(tr,tc))) break;
        const t = G.board[tr][tc];
        if(t){
          if(t.color!==p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type,t.type) && !G.eff.wifiNoCaptureOnCell[key(tr,tc)])
            res.push({from:{r,c},to:{r:tr,c:tc},capture:true});
          break;
        }
        if(!isSunForbidden(tr,tc,p.color))
          res.push({from:{r,c},to:{r:tr,c:tc},capture:false});
      }
    }
    return res;
  }
  const res=[];
  for(const [dr,dc] of dirs){
    let tr=r+dr, tc=c+dc;
    while(inB(tr,tc)){
      if(!canEnterCell(tr,tc,p)) break;
      if((p.type==='q'||p.type==='r'||p.type==='bowl') && G.circles.has(key(tr,tc))) break;
      const t=G.board[tr][tc];
      if(t){
        if(t.color!==p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type))
          res.push({from:{r,c},to:{r:tr,c:tc},capture:true});
        break;
      }
      if(!isSunForbidden(tr,tc,p.color))
        res.push({from:{r,c},to:{r:tr,c:tc},capture:false});
      tr+=dr; tc+=dc;
    }
  }
  return res;
}

function knightLikeMoves(r,c,p){
  const res=[];
  for(const [dr,dc] of KNIGHT_D){
    let tr=r+dr, tc=c+dc;
    if(canWrapPiece(p)){ const w = wrapTo(tr,tc); tr = w.r; tc = w.c; }
    if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color===p.color) continue;
    if(t && isInvulnerable(t)) continue;
    if(t && isDragonImmuneTo(p.type, t.type)) continue;
    if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
    res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
  }
  return res;
}

function checkerMoves(r,c,p){
  const res=[];
  for(const [dr,dc] of KING_D){
    let tr=r+dr, tc=c+dc;
    if(canWrapPiece(p)){ const w = wrapTo(tr,tc); tr = w.r; tc = w.c; }
    if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color===p.color) continue;
    if(t && isInvulnerable(t)) continue;
    if(t && isDragonImmuneTo(p.type, t.type)) continue;
    if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
    res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
  }
  return res;
}

function knightMoves(r,c,p){
  if(G.eff.knightsRooks > 0){
    return slideMoves(r,c,p,ROOK_D);
  }
  if(G.eff.horseHead){
    return bishopMoves(r,c,p);
  }
  const res=[];
  for(const [dr,dc] of KNIGHT_D){
    let tr=r+dr, tc=c+dc;
    if(canWrapPiece(p)){ const w = wrapTo(tr,tc); tr = w.r; tc = w.c; }
    if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color===p.color) continue;
    if(t && isInvulnerable(t)) continue;
    if(t && isDragonImmuneTo(p.type, t.type)) continue;
    if(G.eff.knightsBackward>0){
      const back = p.color==='w' ? dr>0 : dr<0;
      if(!back) continue;
    }
    if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
    res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
  }
  return res;
}

function bishopMoves(r,c,p){
  if(G.eff.bishopsRooks>0) return slideMoves(r,c,p,ROOK_D);
  if(G.eff.bishopsKnights) return knightLikeMoves(r,c,p);
  return slideMoves(r,c,p,BISHOP_D);
}

function monarchMoves(r,c,p){
  // слон, ходит через одну клетку в любом из 8 направлений (прыжок на 2 по диагонали и по прямой? Описание "в любом направлении" → 8 направлений, шаг 2)
  const res=[];
  for(const [dr,dc] of KING_D){
    const tr=r+dr*2, tc=c+dc*2;
    if(!inB(tr,tc)) continue;
    if(!canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color===p.color) continue;
    if(t && isInvulnerable(t)) continue;
    if(t && isDragonImmuneTo(p.type, t.type)) continue;
    if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
    res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
  }
  return res;
}

function eyeMoves(r,c,p){
  // как ферзь, но рубит только на 1 по диагонали
  const res = [];
  const dirs = ROOK_D.concat(BISHOP_D);
  for(const [dr,dc] of dirs){
    let tr = r+dr, tc = c+dc;
    while(inB(tr,tc)){
      if(!canEnterCell(tr,tc,p)) break;
      const t = G.board[tr][tc];
      if(t){
        if(t.color !== p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type)){
          const isDiagonalOneStep = (Math.abs(tr-r)===1 && Math.abs(tc-c)===1);
          if(isDiagonalOneStep && !G.eff.wifiNoCaptureOnCell[key(tr,tc)])
            res.push({from:{r,c},to:{r:tr,c:tc},capture:true});
        }
        break;
      }
      if(!isSunForbidden(tr,tc,p.color))
        res.push({from:{r,c},to:{r:tr,c:tc},capture:false});
      tr += dr; tc += dc;
    }
  }
  return res;
}

function dragonMoves(r,c,p){
  const res=[];
  const offsets = [[-2,0],[-2,-2],[-2,2],[0,-2],[0,2],[2,-2],[2,0],[2,2]];
  for(const [dr,dc] of offsets){
    let tr=r+dr, tc=c+dc;
    if(canWrapPiece(p)){ const w = wrapTo(tr,tc); tr = w.r; tc = w.c; }
    if(!inB(tr,tc)) continue;
    if(!canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color===p.color) continue;
    if(t && isInvulnerable(t)) continue;
    if(t && isDragonImmuneTo(p.type, t.type)) continue;
    if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
    res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
  }
  return res;

function ghostMoves(r,c,p){
  const res=[];
  for(const [dr,dc] of ROOK_D){
    let tr=r+dr*3, tc=c+dc*3;
    if(canWrapPiece(p)){ const w = wrapTo(tr,tc); tr = w.r; tc = w.c; }
    if(!inB(tr,tc)) continue;
    if(!canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color===p.color) continue;
    if(t && isInvulnerable(t)) continue;
    if(t && isDragonImmuneTo(p.type, t.type)) continue;
    if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
    res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
  }
  return res;
}

}

function pawnMoves(r,c,p,forAttack){
  if(p.tempQueen > 0){
    return slideMoves(r,c,p, ROOK_D.concat(BISHOP_D));
  }
  const res = [];
  if(G.eff.evolution){
    for(const [dr,dc] of BISHOP_D){
      const tr = r + dr, tc = c + dc;
      if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
      if(isSunForbidden(tr,tc,p.color)) continue;
      const t = G.board[tr][tc];
      if(t && t.color === p.color) continue;
      if(t && (isInvulnerable(t) || isDragonImmuneTo(p.type, t.type))) continue;
      if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
      res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
    }
  }
  if(G.eff.pawnsBackward[p.color] > 0){
    const dir = p.color==='w' ? 1 : -1;
    const fr = r + dir;
    if(inB(fr,c) && canEnterCell(fr,c,p) && !isSunForbidden(fr,c,p.color)){
      const t = G.board[fr][c];
      if(!t && !forAttack) res.push({from:{r,c},to:{r:fr,c:c},capture:false});
      if(t && t.color!==p.color && p.canCaptureForward && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type)) res.push({from:{r,c},to:{r:fr,c:c},capture:true});
    }
    for(const dc of [-1,1]){
      const tr = r + dir, tc = c + dc;
      if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
      if(isSunForbidden(tr,tc,p.color)) continue;
      const t = G.board[tr][tc];
      if(t && t.color!==p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type) && !G.eff.wifiNoCaptureOnCell[key(tr,tc)]) res.push({from:{r,c},to:{r:tr,c:tc},capture:true});
    }
    return res;
  }
  const dir = p.color==='w' ? -1 : 1;
  if(G.eff.pawnsAnyDir>0){
    for(const [dr,dc] of KING_D){
      const tr=r+dr, tc=c+dc;
      if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
      if(isSunForbidden(tr,tc,p.color)) continue;
      const t=G.board[tr][tc];
      if(t && t.color===p.color) continue;
      if(t && isInvulnerable(t)) continue;
      if(t && isDragonImmuneTo(p.type, t.type)) continue;
      if(t && G.eff.wifiNoCaptureOnCell[key(tr,tc)]) continue;
      res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
    }
    return res;
  }
  const fr=r+dir;
  if(inB(fr,c) && canEnterCell(fr,c,p) && !isSunForbidden(fr,c,p.color)){
    const t=G.board[fr][c];
    if(!t && !forAttack){
      res.push({from:{r,c},to:{r:fr,c:c},capture:false});
      if(!p.moved || G.eff.pawnsTwoStep > 0){
        const fr2=r+2*dir;
        if(inB(fr2,c) && canEnterCell(fr2,c,p) && !G.board[fr2][c] && !G.board[fr][c]
           && !isSunForbidden(fr2,c,p.color)){
          res.push({from:{r,c},to:{r:fr2,c:c},capture:false,double:true});
        }
      }
    }
    if(t && t.color!==p.color && p.canCaptureForward && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type)){
      res.push({from:{r,c},to:{r:fr,c:c},capture:true});
    }
  }
  for(const dc of [-1,1]){
    const tr=r+dir, tc=c+dc;
    if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) continue;
    if(isSunForbidden(tr,tc,p.color)) continue;
    const t=G.board[tr][tc];
    if(t && t.color!==p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type) && !G.eff.wifiNoCaptureOnCell[key(tr,tc)]){
      res.push({from:{r,c},to:{r:tr,c:tc},capture:true});
    } else if(!t && G.enPassant && G.enPassant.r===tr && G.enPassant.c===tc){
      const cr = p.color==='w' ? tr+1 : tr-1;
      const cp = G.board[cr] ? G.board[cr][tc] : null;
      if(cp && cp.type==='p' && cp.color!==p.color){
        res.push({from:{r,c},to:{r:tr,c:tc},capture:true,enPassant:true});
      }
    }
  }
  return res;
}

function kingMoves(r,c,p){
  if(G.eff.kingAsRook[p.color] > 0){
    return slideMoves(r,c,p, ROOK_D);
  }
  const res=[];
  const dist = G.eff.kingTwoStep[p.color]>0 ? 2 : 1;
  for(const [dr,dc] of KING_D){
    for(let k=1;k<=dist;k++){
      let tr=r+dr*k, tc=c+dc*k;
      if(canWrapPiece(p)){ const w = wrapTo(tr,tc); tr = w.r; tc = w.c; }
      if(!inB(tr,tc) || !canEnterCell(tr,tc,p)) break;
      if(isSunForbidden(tr,tc,p.color)) break;
      const t=G.board[tr][tc];
      if(t && t.color===p.color) break;
      if(t && isInvulnerable(t)) break;
      if(t && isDragonImmuneTo(p.type, t.type)) break;
      res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t});
      if(t) break;
    }
  }
  return res;
}

function addExtraMoves(res, r, c, p, extra){
  for(const m of extra){
    if(!res.some(x => x.to.r===m.to.r && x.to.c===m.to.c)){
      res.push(m);
    }
  }
}

function pieceMoves(r,c,p,forAttack){
  if(p.statue !== 0) return [];
  if(p.frozen > 0) return [];
  if(p.anchorTurns > 0) return [];
  let res = [];
  switch(p.type){
    case 'p': res = pawnMoves(r,c,p,forAttack); break;
    case 'n': res = knightMoves(r,c,p); break;
    case 'b':
      if(p.isMonarch) res = monarchMoves(r,c,p);
      else if(p.isEye) res = eyeMoves(r,c,p);
      else res = bishopMoves(r,c,p);
      break;
    case 'r':
      if(p.isAngel) res = slideMoves(r,c,p,ROOK_D);
      else res = slideMoves(r,c,p,ROOK_D);
      break;
    case 'bowl': res = slideMoves(r,c,p,ROOK_D); break;
    case 'dino': res = dinoMoves(r,c,p); break;
    case 'dragon': res = dragonMoves(r,c,p); break;
    case 'ghost': res = ghostMoves(r,c,p); break;
    case 'monolith': res = []; break;
    case 'demon': res = []; break;
    case 'q':
      if(G.eff.queenAsPawn[p.color] > 0){
        res = pawnMoves(r,c,p,forAttack);
      } else {
        res = slideMoves(r,c,p,ROOK_D.concat(BISHOP_D));
      }
      break;
    case 'k': res = kingMoves(r,c,p); break;
    case 'c': res = checkerMoves(r,c,p); break;
    default: return [];
  }

  // Wi-Fi: extra 3-radius non-capture moves
  if(G.wifiCells.has(key(r,c))){
    addExtraMoves(res, r, c, p, wifiMoves(r,c,p));
  }

  if(p.type !== 'k' && p.suitKnightTurns > 0){
    addExtraMoves(res, r, c, p, knightLikeMoves(r,c,p));
  }
  if(p.type !== 'k' && p.suitRookTurns > 0){
    addExtraMoves(res, r, c, p, slideMoves(r,c,p,ROOK_D));
  }

  if(G.portals.length === 2){
    const p1 = G.portals[0], p2 = G.portals[1];
    let other = null;
    if(r === p1.r && c === p1.c) other = p2;
    else if(r === p2.r && c === p2.c) other = p1;
    if(other){
      const tr = other.r, tc = other.c;
      if(inB(tr,tc) && canEnterCell(tr,tc,p) && !isSunForbidden(tr,tc,p.color)){
        const t = G.board[tr][tc];
        if(!t || (t.color !== p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type) && !G.eff.wifiNoCaptureOnCell[key(tr,tc)])){
          if(!res.some(m => m.to.r === tr && m.to.c === tc)){
            res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t, portal:true});
          }
        }
      }
    }
  }
  if(G.b2Active){
    const L = getLinkFromMain(r,c);
    if(L){
      const tr = L.second.r, tc = L.second.c;
      if(inB2(tr,tc)){
        const t = G.board2[tr][tc];
        if(!t || (t.color !== p.color && !isInvulnerable(t) && !isDragonImmuneTo(p.type, t.type))){
          if(!res.some(m => m.to.r===tr && m.to.c===tc && m.toBoard2)){
            res.push({from:{r,c},to:{r:tr,c:tc},capture:!!t,toBoard2:true,teleport:true});
          }
        }
      }
    }
  }
  return res;
}

function isAttackedBoard(r,c,by,isTargetB2){
  if(!isTargetB2){
    const target = G.board[r] ? G.board[r][c] : null;
    for(let i=G.minR;i<=G.maxR;i++){
      for(let j=G.minC;j<=G.maxC;j++){
        const p=G.board[i][j];
        if(!p || p.color!==by || p.color==='n') continue;
        if(target && isDragonImmuneTo(p.type, target.type)) continue;
        const ms = pieceMoves(i,j,p,true);
        for(const m of ms){
          if(m.to.r===r && m.to.c===c && !m.toBoard2) return true;
        }
      }
    }
  } else {
    if(!G.b2Active) return false;
    const target = G.board2[r] ? G.board2[r][c] : null;
    for(let i=G.b2.minR;i<=G.b2.maxR;i++){
      for(let j=G.b2.minC;j<=G.b2.maxC;j++){
        const p=G.board2[i][j];
        if(!p || p.color!==by || p.color==='n') continue;
        if(target && isDragonImmuneTo(p.type, target.type)) continue;
        const ms = pieceMoves2(i,j,p,true);
        for(const m of ms){
          if(m.to.r===r && m.to.c===c) return true;
        }
      }
    }
  }
  return false;
}
function isAttacked(r,c,by){ return isAttackedBoard(r,c,by,false); }

function castlingMoves(color){
  const res=[];
  const row = color==='w' ? INIT.maxR : INIT.minR;
  const kc  = INIT.kingCol;
  const k = G.board[row] ? G.board[row][kc] : null;
  if(!k || k.type!=='k' || k.color!==color || k.moved || k.statue!==0 || k.frozen>0 || k.anchorTurns>0) return res;
  const opp = oppOf(color);
  if(isAttacked(row,kc,opp)) return res;
  const rk = G.board[row][INIT.rightRookCol];
  if(rk && rk.type==='r' && rk.color===color && !rk.moved){
    let ok=true;
    for(let c=kc+1;c<INIT.rightRookCol;c++){
      if(G.board[row][c] || G.blocked.has(key(row,c))) ok=false;
    }
    if(ok && !isAttacked(row,kc+1,opp) && !isAttacked(row,kc+2,opp)){
      res.push({from:{r:row,c:kc},to:{r:row,c:kc+2},capture:false,castle:'k'});
    }
  }
  const rq = G.board[row][INIT.leftRookCol];
  if(rq && rq.type==='r' && rq.color===color && !rq.moved){
    let ok=true;
    for(let c=INIT.leftRookCol+1;c<kc;c++){
      if(G.board[row][c] || G.blocked.has(key(row,c))) ok=false;
    }
    if(ok && !isAttacked(row,kc-1,opp) && !isAttacked(row,kc-2,opp)){
      res.push({from:{r:row,c:kc},to:{r:row,c:kc-2},capture:false,castle:'q'});
    }
  }
  return res;
}

function setPieceAt(r,c,b2,val){ if(b2) G.board2[r][c] = val; else G.board[r][c] = val; }

function makeMove(m){
  const fromB2 = !!m.fromBoard2;
  const toB2 = !!m.toBoard2;
  const p = getPieceAt(m.from.r, m.from.c, fromB2);
  const captured = getPieceAt(m.to.r, m.to.c, toB2);
  const u = {
    m, captured, p,
    epCap:null, epPos:null, rook:null,
    movedFlag: p.moved, ep: G.enPassant
  };
  if(m.enPassant && !fromB2 && !toB2){
    const cr = p.color==='w' ? m.to.r+1 : m.to.r-1;
    u.epCap = G.board[cr][m.to.c];
    u.epPos = {r:cr, c:m.to.c};
    G.board[cr][m.to.c] = null;
  }
  setPieceAt(m.from.r, m.from.c, fromB2, null);
  setPieceAt(m.to.r, m.to.c, toB2, p);
  if(m.castle && !fromB2 && !toB2){
    const row = m.from.r;
    const rf = m.castle==='k' ? INIT.rightRookCol : INIT.leftRookCol;
    const rt = m.castle==='k' ? INIT.kingCol+1 : INIT.kingCol-1;
    const rp = G.board[row][rf];
    u.rook = {row, rf, rt, rp, movedFlag: rp ? rp.moved : false};
    G.board[row][rt] = rp;
    G.board[row][rf] = null;
    if(rp) rp.moved = true;
  }
  p.moved = true;
  G.enPassant = (m.double && !fromB2 && !toB2) ? {r:(m.from.r+m.to.r)/2, c:m.from.c} : null;
  return u;
}

function undoMove(u){
  const m = u.m;
  const p = u.p;
  const fromB2 = !!m.fromBoard2;
  const toB2 = !!m.toBoard2;
  setPieceAt(m.to.r, m.to.c, toB2, null);
  setPieceAt(m.from.r, m.from.c, fromB2, p);
  if(u.captured) setPieceAt(m.to.r, m.to.c, toB2, u.captured);
  if(u.epCap) G.board[u.epPos.r][u.epPos.c] = u.epCap;
  if(u.rook){
    G.board[u.rook.row][u.rook.rf] = u.rook.rp;
    G.board[u.rook.row][u.rook.rt] = null;
    if(u.rook.rp) u.rook.rp.moved = u.rook.movedFlag;
  }
  p.moved = u.movedFlag;
  G.enPassant = u.ep;
}

/* ============================ ЛЕГАЛЬНЫЕ ХОДЫ ============================ */
function legalMoves(color){
  const res = [];
  const immune = G.eff.kingImmune[color] > 0;
  const opp = oppOf(color);
  const noCap = G.eff.noCapture[color] > 0;

  function sandboxCheck(m){
    const u = makeMove(m);
    const k = findKing(color);
    const bad = k ? isAttackedBoard(k.r, k.c, opp, !!k.b2) : false;
    undoMove(u);
    return bad;
  }

  for(let r=G.minR;r<=G.maxR;r++){
    for(let c=G.minC;c<=G.maxC;c++){
      const p = G.board[r][c];
      if(!p || p.color!==color) continue;
      let ms = pieceMoves(r,c,p,false);
      if(p.type==='k') ms = ms.concat(castlingMoves(color));
      ms = ms.filter(m => {
        const target = m.toBoard2 ? (G.board2[m.to.r]?.[m.to.c]) : G.board[m.to.r]?.[m.to.c];
        if(target){
          if(isInvulnerable(target)) return false;
          if(isDragonImmuneTo(p.type, target.type)) return false;
        }
        return true;
      });
      for(const m of ms){
        if(noCap && m.capture) continue;
        if(!immune){
          if(sandboxCheck(m)) continue;
        }
        res.push(m);
      }
    }
  }
  if(G.b2Active){
    for(let r=G.b2.minR;r<=G.b2.maxR;r++){
      for(let c=G.b2.minC;c<=G.b2.maxC;c++){
        const p = G.board2[r][c];
        if(!p || p.color!==color) continue;
        let ms = pieceMoves2(r,c,p,false);
        ms = ms.filter(m => {
          const target = m.toBoard2 ? (G.board2[m.to.r]?.[m.to.c]) : G.board[m.to.r]?.[m.to.c];
          if(target){
            if(isInvulnerable(target)) return false;
            if(isDragonImmuneTo(p.type, target.type)) return false;
          }
          return true;
        });
        for(const m of ms){
          if(noCap && m.capture) continue;
          if(!immune){
            if(sandboxCheck(m)) continue;
          }
          res.push(m);
        }
      }
    }
  }
  return res;
}

/* ============================ КАРТОЧКИ ============================ */
function applyCard(color, id){
  const opp = oppOf(color);
  const who = color==='w' ? 'Белые' : 'Чёрные';
  const card = CARDS.find(c=>c.id===id);
  log(`${who}: ${card.icon} «${card.name}»`);

  switch(id){
    case 'bishopsKnights': G.eff.bishopsKnights = true; log('→ Слоны теперь ходят как кони.'); break;
    case 'kingQueenSwap': {
      const k = findPiece(color,'k'), q = findPiece(color,'q');
      if(k && q){
        const t = getPieceAt(k.r,k.c,k.b2);
        setPieceAt(k.r,k.c,k.b2, getPieceAt(q.r,q.c,q.b2));
        setPieceAt(q.r,q.c,q.b2, t);
        log('→ Король и ферзь поменялись местами.');
      } else log('→ Не сработало.');
      break;
    }
    case 'pawnToRook': {
      const list = allPieces(color).filter(x=>x.p.type==='p');
      if(list.length){ const t = pick(list); t.p.type = 'r'; log(`→ Пешка на ${sqName(t.r,t.c)} стала ладьёй.`); }
      else log('→ Нет пешек.');
      break;
    }
    case 'kingImmune': G.eff.kingImmune[color] = 6; log('→ Король неуязвим 3 хода.'); break;
    case 'noCapture': G.eff.noCapture[opp] = 2; log('→ Противник не может рубить 1 ход.'); break;
    case 'knightsSwap': {
      const wn = allPieces('w').filter(x=>x.p.type==='n').sort((a,b)=>a.r-b.r||a.c-b.c);
      const bn = allPieces('b').filter(x=>x.p.type==='n').sort((a,b)=>a.r-b.r||a.c-b.c);
      const n = Math.min(wn.length, bn.length);
      for(let i=0;i<n;i++){ const t = G.board[wn[i].r][wn[i].c]; G.board[wn[i].r][wn[i].c] = G.board[bn[i].r][bn[i].c]; G.board[bn[i].r][bn[i].c] = t; }
      log(n ? `→ Обменяно коней: ${n}.` : '→ Нет коней.');
      break;
    }
    case 'enemyPawnColor': {
      const list = allPieces(opp).filter(x=>x.p.type==='p');
      if(list.length){
        const t = pick(list);
        t.p.color = color; t.p.moved = true; t.p.canCaptureForward = false;
        if(color==='w' && t.r===G.minR) t.p.type='q';
        if(color==='b' && t.r===G.maxR) t.p.type='q';
        log(`→ Пешка на ${sqName(t.r,t.c)} перешла на вашу сторону.`);
      } else log('→ Нет пешек противника.');
      break;
    }
    case 'blockTwo': {
      const cells = emptyCells().filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)));
      let n=0;
      for(let i=0;i<2 && cells.length;i++){ const idx = Math.floor(Math.random()*cells.length); const t = cells.splice(idx,1)[0]; G.blocked.add(key(t.r,t.c)); n++; }
      log(`→ Заблокировано полей: ${n}.`);
      break;
    }
    case 'pawnForwardCapture': {
      const list = allPieces(color).filter(x=>x.p.type==='p');
      if(list.length){ const t = pick(list); t.p.canCaptureForward = true; log(`→ Пешка на ${sqName(t.r,t.c)} рубит вперёд.`); }
      else log('→ Нет пешек.');
      break;
    }
    case 'bishopsRooks': G.eff.bishopsRooks = 6; log('→ Слоны ходят как ладьи 3 хода.'); break;
    case 'pawnVanish': {
      const list = allPieces(opp).filter(x=>x.p.type==='p');
      if(list.length){ const t = pick(list); G.board[t.r][t.c] = null; log(`→ Пешка на ${sqName(t.r,t.c)} исчезла.`); }
      else log('→ Нет пешек противника.');
      break;
    }
    case 'kingTwoStep': G.eff.kingTwoStep[color] = 3; log('→ Король ходит на две клетки два хода (кроме доски 2).'); break;
    case 'expandBoard': if(G.minR>0) G.minR--; if(G.maxR<SIZE-1) G.maxR++; if(G.minC>0) G.minC--; if(G.maxC<SIZE-1) G.maxC++; log('→ Доска расширена.'); break;
    case 'enemyBishopToPawn': {
      const list = allPieces(opp).filter(x=>x.p.type==='b');
      if(list.length){ const t = pick(list); t.p.type = 'p'; t.p.moved = true; t.p.canCaptureForward = false; log(`→ Слон на ${sqName(t.r,t.c)} стал пешкой.`); }
      else log('→ Нет слонов противника.');
      break;
    }
    case 'mine': {
      const cells = emptyCells().filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)));
      if(cells.length){ const t = pick(cells); G.mines.add(key(t.r,t.c)); log(`→ Мина на ${sqName(t.r,t.c)}.`); }
      else log('→ Нет свободных полей.');
      break;
    }
    case 'centerBlock': {
      const mr = (G.minR+G.maxR)/2, mc = (G.minC+G.maxC)/2;
      const cand = [ {r:Math.floor(mr),c:Math.floor(mc)}, {r:Math.floor(mr),c:Math.ceil(mc)}, {r:Math.ceil(mr), c:Math.floor(mc)}, {r:Math.ceil(mr), c:Math.ceil(mc)} ];
      const uniq=[];
      for(const x of cand) if(!uniq.some(y=>y.r===x.r&&y.c===x.c)) uniq.push(x);
      if(uniq.every(x=>!G.board[x.r][x.c])){ uniq.forEach(x=>G.blocked.add(key(x.r,x.c))); log('→ Центральные клетки заблокированы.'); }
      else log('→ В центре есть фигуры.');
      break;
    }
    case 'newPawn': {
      const mid = (G.minR+G.maxR)/2;
      let cells = emptyCells().filter(x=> color==='w' ? x.r>mid : x.r<mid);
      cells = cells.filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)) && !isGreenBlue(x.r,x.c));
      if(cells.length){ const t = pick(cells); const np = mk(color,'p'); np.moved = true; G.board[t.r][t.c] = np; log(`→ Новая пешка на ${sqName(t.r,t.c)}.`); }
      else log('→ Нет места.');
      break;
    }
    case 'swapHalves': {
      const mid = G.minR + G.maxR;
      for(let r=G.minR; r<mid-r; r++){
        const mr = mid - r;
        for(let c=G.minC; c<=G.maxC; c++){ const t = G.board[r][c]; G.board[r][c] = G.board[mr][c]; G.board[mr][c] = t; }
      }
      log('→ Половинки поменялись местами.');
      break;
    }
    case 'enemyKnightStatue': {
      const list = allPieces(opp).filter(x=>x.p.type==='n' && x.p.statue<=0);
      if(list.length){ const t = pick(list); t.p.statue = 6; log(`→ Конь на ${sqName(t.r,t.c)} окаменел.`); }
      else log('→ Нет коней противника.');
      break;
    }
    case 'blockLine': {
      const lines=[];
      for(let r=G.minR;r<=G.maxR;r++){ let free=true; for(let c=G.minC;c<=G.maxC;c++) if(G.board[r][c]) free=false; if(free) lines.push({type:'r', idx:r}); }
      for(let c=G.minC;c<=G.maxC;c++){ let free=true; for(let r=G.minR;r<=G.maxR;r++) if(G.board[r][c]) free=false; if(free) lines.push({type:'c', idx:c}); }
      if(lines.length){
        const L = pick(lines);
        if(L.type==='r'){ for(let c=G.minC;c<=G.maxC;c++) G.blocked.add(key(L.idx,c)); log('→ Горизонталь закрыта.'); }
        else { for(let r=G.minR;r<=G.maxR;r++) G.blocked.add(key(r,L.idx)); log('→ Вертикаль закрыта.'); }
      } else log('→ Нет свободных линий.');
      break;
    }
    case 'flagMines': {
      const cells = emptyCells().filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)));
      let n=0;
      for(let i=0;i<5 && cells.length;i++){ const idx = Math.floor(Math.random()*cells.length); const t = cells.splice(idx,1)[0]; G.flags.add(key(t.r,t.c)); n++; }
      log(`→ Флажков: ${n}.`);
      break;
    }
    case 'knightsBackward': G.eff.knightsBackward = 8; log('→ Кони назад 4 хода.'); break;
    case 'pawnsAnyDir': G.eff.pawnsAnyDir = 10; log('→ Пешки в любую сторону 5 ходов.'); break;
    case 'opponentNoCards2': G.eff.cardLock[opp] = 4; log('→ Противник не может использовать карты 2 хода.'); break;
    case 'pawnTempQueen': {
      const list = allPieces(color).filter(x=>x.p.type==='p');
      if(list.length){ const t = pick(list); t.p.tempQueen = 4; log(`→ Пешка на ${sqName(t.r,t.c)} — ферзь.`); }
      else log('→ Нет пешек.');
      break;
    }
    case 'knightsRooks': G.eff.knightsRooks = 6; log('→ Кони-ладьи 3 хода.'); break;
    case 'enemyQueenAsPawn': G.eff.queenAsPawn[opp] = 4; log('→ Ферзь противника как пешка 2 хода.'); break;
    case 'portal': {
      const cells = emptyCells();
      if(cells.length >= 2){
        const shuffled = shuffle(cells);
        G.portals = [shuffled[0], shuffled[1]];
        log(`→ Портал: ${sqName(shuffled[0].r,shuffled[0].c)} ↔ ${sqName(shuffled[1].r,shuffled[1].c)}.`);
      } else log('→ Недостаточно клеток.');
      break;
    }
    case 'swapWithEnemy': {
      const mine = allPieces(color); const enemies = allPieces(opp);
      if(mine.length && enemies.length){
        const a = pick(mine); const b = pick(enemies);
        const t = G.board[a.r][a.c];
        G.board[a.r][a.c] = G.board[b.r][b.c];
        G.board[b.r][b.c] = t;
        log(`→ Обмен: ${sqName(a.r,a.c)} ↔ ${sqName(b.r,b.c)}.`);
      } else log('→ Мало фигур.');
      break;
    }
    case 'shiftEnemyPiece': {
      const enemies = allPieces(opp);
      let done = false;
      if(enemies.length){
        const shuffledEnemies = shuffle(enemies);
        for(const t of shuffledEnemies){
          const dirs = shuffle(KING_D);
          for(const [dr,dc] of dirs){
            const tr = t.r + dr, tc = t.c + dc;
            if(inB(tr,tc) && !isBlockedCell(tr,tc) && !G.board[tr][tc]){
              G.board[tr][tc] = G.board[t.r][t.c];
              G.board[t.r][t.c] = null;
              log(`→ Сдвиг: ${sqName(t.r,t.c)} → ${sqName(tr,tc)}.`);
              done = true;
              break;
            }
          }
          if(done) break;
        }
      }
      if(!done) log('→ Не удалось сдвинуть.');
      break;
    }
    case 'swapHands': { const temp = G.hands.w; G.hands.w = G.hands.b; G.hands.b = temp; log('→ Обмен картами.'); break; }
    case 'shuffleAllPieces': {
      const pieces = []; const positions = [];
      for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){
        if(G.board[r][c] && !G.blocked.has(key(r,c))){
          pieces.push(G.board[r][c]);
          positions.push({r,c});
        }
      }
      if(pieces.length > 1){
        const shuffled = shuffle(pieces);
        for(let i=0;i<positions.length;i++){ G.board[positions[i].r][positions[i].c] = shuffled[i]; }
        log('→ Все фигуры перемешаны.');
      }
      break;
    }
    case 'captureLosePawn': G.eff.captureLosePawn[color] = 1; log('→ При взятии противник потеряет пешку.'); break;
    case 'copyPawn': {
      const pawns = allPieces(color).filter(x=>x.p.type==='p');
      let done = false;
      if(pawns.length){
        const shuffledPawns = shuffle(pawns);
        for(const t of shuffledPawns){
          const dirs = shuffle(KING_D);
          for(const [dr,dc] of dirs){
            const tr = t.r + dr, tc = t.c + dc;
            if(inB(tr,tc) && !isBlockedCell(tr,tc) && !G.board[tr][tc] && !isGreenBlue(tr,tc)){
              const np = mk(color, 'p'); np.moved = true;
              G.board[tr][tc] = np;
              log(`→ Копия пешки на ${sqName(tr,tc)}.`);
              done = true;
              break;
            }
          }
          if(done) break;
        }
      }
      if(!done) log('→ Нет места для копии.');
      break;
    }
    case 'enemyPawnsBackward': G.eff.pawnsBackward[opp] = 10; log('→ Пешки противника назад 5 ходов.'); break;
    case 'replaceEnemyCards': for(let i=0;i<G.hands[opp].length;i++){ G.hands[opp][i] = randomCardId(); } log('→ Карты противника обновлены.'); break;
    case 'blockSix': {
      const cells = emptyCells().filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)));
      let n = 0;
      for(let i=0;i<6 && cells.length;i++){ const idx = Math.floor(Math.random()*cells.length); const t = cells.splice(idx,1)[0]; G.blocked.add(key(t.r,t.c)); n++; }
      log(`→ Заблокировано: ${n}.`);
      break;
    }
    case 'knightToQueen': {
      const knights = allPieces(color).filter(x=>x.p.type==='n');
      if(knights.length){ const t = pick(knights); t.p.type = 'q'; log(`→ Конь на ${sqName(t.r,t.c)} стал ферзём.`); }
      else log('→ Нет коней.');
      break;
    }
    case 'enemyQueenToPawn': {
      const q = findPiece(opp, 'q');
      if(q){ q.p.type = 'p'; q.p.moved = true; q.p.canCaptureForward = false; log(`→ Ферзь на ${sqName(q.r,q.c)} стал пешкой.`); }
      else log('→ Нет ферзя противника.');
      break;
    }
    case 'halfPiecesVanish': {
      const pawns = allPieces(null).filter(x=>x.p.type === 'p');
      if(pawns.length > 1){
        const shuffled = shuffle(pawns);
        const toRemove = Math.floor(shuffled.length / 2);
        for(let i=0;i<toRemove;i++){ const t = shuffled[i]; G.board[t.r][t.c] = null; }
        log(`→ Исчезло пешек: ${toRemove}.`);
      } else log('→ Недостаточно пешек.');
      break;
    }
    case 'threeKnightsEach': {
      for(const col of ['w','b']){
        for(let i=0;i<3;i++){
          let cells = emptyCells().filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)) && !G.cups.has(key(x.r,x.c)) && !isGreenBlue(x.r,x.c));
          if(cells.length){ const t = pick(cells); const np = mk(col, 'n'); np.moved = true; G.board[t.r][t.c] = np; }
        }
      }
      log('→ Каждый получил по три коня.');
      break;
    }
    case 'pawnsTwoStep': G.eff.pawnsTwoStep = 10; log('→ Пешки на две клетки 5 ходов.'); break;
    case 'greenDarkCells': {
      const darkCells = [];
      for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){ if((r+c)%2===1) darkCells.push({r,c}); }
      const shuffled = shuffle(darkCells); const half = Math.floor(shuffled.length / 2);
      for(let i=0;i<half;i++){ G.greenCells.add(key(shuffled[i].r, shuffled[i].c)); }
      log(`→ Зелёных клеток: ${half}.`);
      break;
    }
    case 'blueLightCells': {
      const lightCells = [];
      for(let r=G.minR;r<=G.maxR;r++) for(let c=G.minC;c<=G.maxC;c++){ if((r+c)%2===0) lightCells.push({r,c}); }
      const shuffled = shuffle(lightCells); const half = Math.floor(shuffled.length / 2);
      for(let i=0;i<half;i++){ G.blueCells.add(key(shuffled[i].r, shuffled[i].c)); }
      log(`→ Синих клеток: ${half}.`);
      break;
    }
    case 'checkers': {
      for(const col of ['w','b']){
        let cells = emptyCells().filter(x=>!G.mines.has(key(x.r,x.c)) && !G.flags.has(key(x.r,x.c)) && !G.cups.has(key(x.r,x.c)) && !isGreenBlue(x.r,x.c));
        if(cells.length){ const t = pick(cells); const np = mk(col, 'c'); np.moved = true; G.board[t.r][t.c] = np; }
      }
      log('→ Каждый получил по шашке.');
      break;
    }
    case 'cornerRooks': {
      const corners = [
        {r:G.minR, c:G.minC, color:'b'}, {r:G.minR, c:G.maxC, color:'b'},
        {r:G.maxR, c:G.minC, color:'w'}, {r:G.maxR, c:G.maxC, color:'w'}
      ];
      for(const corner of corners){
        if(!G.board[corner.r][corner.c] && !isBlockedCell(corner.r, corner.c)){
          const np = mk(corner.color, 'r'); np.moved = true; G.board[corner.r][corner.c] = np;
        }
